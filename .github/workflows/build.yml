
name: Build GTA VI Countdown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0

      - name: Extraer, corregir y compilar
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

          unzip -q GTA6Countdown_GitHub_Actions.zip -d extracted

          PROJECT_DIR="extracted/GTA6CountdownAndroid"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: No se encuentra settings.gradle"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          xml_file = Path("app/src/main/res/xml/countdown_widget_info.xml")

          if not xml_file.is_file():
              print("ERROR: No se encuentra el XML del widget.")
              sys.exit(1)

          source = xml_file.read_text(encoding="utf-8")

          fixed, count = re.subn(
              r"""\\s+(?:android:)?description\\s*=\\s*(?:"[^"]*"|'[^']*')""",
              "",
              source,
              flags=re.IGNORECASE
          )

          if count == 0 and re.search(r"\bdescription\s*=", source, re.IGNORECASE):
              print("ERROR: No se pudo corregir el atributo description.")
              print(source)
              sys.exit(1)

          if count > 0:
              xml_file.write_text(fixed, encoding="utf-8")
              print(f"CORRECTO: Se han corregido {count} atributos description.")

          print(xml_file.read_text(encoding="utf-8"))
          PY

          gradle --no-daemon assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK generado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/GTA6Countdown.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Countdown-APK
          path: output/GTA6Countdown.apk
          if-no-files-found: error
