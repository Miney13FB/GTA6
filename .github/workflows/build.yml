
name: Build GTA VI Countdown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extraer y compilar proyecto
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

          unzip -q GTA6Countdown_GitHub_Actions.zip -d extracted

          WRAPPER=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK generado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/GTA6Countdown.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Countdown-APK
          path: output/GTA6Countdown.apk
          if-no-files-found: error
