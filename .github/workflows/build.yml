
name: Build GTA VI Countdown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0

      - name: Extraer y corregir proyecto
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

          unzip -q GTA6Countdown_GitHub_Actions.zip -d extracted

          PROJECT_DIR="extracted/GTA6CountdownAndroid"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: No se encuentra settings.gradle"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          cd "$PROJECT_DIR"

          XML_FILE="app/src/main/res/xml/countdown_widget_info.xml"

          if [ ! -f "$XML_FILE" ]; then
            echo "ERROR: No se encuentra el XML del widget."
            exit 1
          fi

          echo "XML original:"
          cat "$XML_FILE"

          sed -i 's/[[:space:]]*android:description="[^"]*"//g' "$XML_FILE"

          if grep -q 'android:description=' "$XML_FILE"; then
            echo "ERROR: El atributo sigue presente."
            exit 1
          fi

          echo "CORRECTO: Atributo description eliminado."
          cat "$XML_FILE"

          gradle --no-daemon assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/GTA6Countdown.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Countdown-APK
          path: output/GTA6Countdown.apk
          if-no-files-found: error
